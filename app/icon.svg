<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded corner background mimicking the rounded-xl menu button -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bg-gradient)" />
  
  <!-- Subtle gold border -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3" />
  
  <!-- Golden Cloud Icon positioned in the center -->
  <g transform="translate(4, 4) scale(1)">
    <path 
      d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" 
